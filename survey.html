<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Take Survey - 10xQuery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            background: '#0a0a0a',
            surface: '#111111',
            border: '#222222',
            textMain: '#ededed',
            textMuted: '#a1a1aa',
            primary: '#0070f3',
            primaryHover: '#0051a8'
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0a0a0a; color: #ededed; -webkit-font-smoothing: antialiased; }
    
    .glass-panel {
      background: rgba(17, 17, 17, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid #222222;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    }
    
    .input-field {
      width: 100%; background: #000; border: 1px solid #333; color: #fff;
      padding: 12px 16px; border-radius: 8px; outline: none; transition: all 0.2s ease;
      font-size: 14px;
    }
    .input-field:focus { border-color: #0070f3; box-shadow: 0 0 0 1px #0070f3; }
    
    .btn-primary {
      background: #ededed; color: #0a0a0a; border: none; padding: 12px 24px;
      border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s ease;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary:hover { background: #fff; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <nav class="border-b border-border bg-surface h-16 flex items-center px-8 justify-center shrink-0">
    <a href="/" class="font-bold text-lg tracking-tight hover:opacity-80 transition-opacity">10xQuery</a>
  </nav>

  <main class="flex-1 w-full max-w-2xl mx-auto p-4 md:p-8 flex flex-col items-center justify-center">
    
    <div id="loading" class="text-center text-textMuted flex flex-col items-center gap-4">
      <svg class="animate-spin h-8 w-8 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <span>Loading survey...</span>
    </div>

    <!-- Auth View for Private Surveys -->
    <div id="auth-view" class="w-full max-w-md hidden fade-in">
      <div class="glass-panel p-8 rounded-2xl">
        <div class="mb-6 flex items-center gap-3 text-red-400 bg-red-950/20 p-4 border border-red-900/30 rounded-lg">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <span class="text-sm font-medium">This survey is private.</span>
        </div>
        <form onsubmit="handleAuth(event)">
          <div class="mb-6">
            <label class="block text-sm font-medium text-textMuted mb-2">Access ID</label>
            <input type="text" id="viewerId" class="input-field text-center tracking-widest font-mono text-lg" placeholder="12345678" required autocomplete="off" maxlength="8">
            <p class="text-xs text-textMuted mt-2 text-center">Enter your 8-digit User ID to unlock.</p>
          </div>
          <button type="submit" id="authBtn" class="btn-primary w-full">Unlock Survey</button>
        </form>
      </div>
    </div>

    <!-- Survey Content View -->
    <div id="survey-view" class="w-full hidden fade-in">
      <div class="glass-panel p-8 md:p-10 rounded-2xl">
        <div class="mb-8 pb-8 border-b border-border">
          <h1 id="title" class="text-3xl font-bold tracking-tight mb-3"></h1>
          <p id="desc" class="text-textMuted text-lg leading-relaxed"></p>
        </div>
        
        <form onsubmit="handleSubmit(event)" id="survey-form">
          <div class="mb-8">
            <label class="block text-base font-medium text-textMain mb-4">Your response</label>
            <textarea id="answer" class="input-field resize-y min-h-[160px] p-4 text-base leading-relaxed" placeholder="Type your answer here..." required></textarea>
          </div>
          <div class="flex justify-end">
            <button type="submit" id="submitBtn" class="btn-primary">
              Submit Response
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Success View -->
    <div id="success-view" class="w-full hidden fade-in text-center">
      <div class="glass-panel p-12 rounded-2xl flex flex-col items-center justify-center">
        <div class="w-16 h-16 bg-green-500/10 text-green-500 rounded-full flex items-center justify-center mb-6">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <h2 class="text-2xl font-bold tracking-tight mb-2">Response recorded</h2>
        <p class="text-textMuted">Thank you for taking the time to share your thoughts.</p>
      </div>
    </div>

    <!-- Error View -->
    <div id="error-view" class="w-full hidden fade-in text-center">
      <div class="glass-panel p-12 rounded-2xl flex flex-col items-center justify-center border-red-900/30">
        <div class="w-16 h-16 bg-red-500/10 text-red-500 rounded-full flex items-center justify-center mb-6">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        </div>
        <h2 id="error-title" class="text-2xl font-bold tracking-tight mb-2">Survey Not Found</h2>
        <p id="error-desc" class="text-textMuted">The link might be broken or you do not have permission.</p>
      </div>
    </div>

  </main>

  <script>
    const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:8000' : 'https://api.10xquery.com';
    const params = new URLSearchParams(window.location.search);
    const surveyId = params.get('id');
    let currentUserId = null;

    function showView(viewId) {
      ['loading', 'auth-view', 'survey-view', 'success-view', 'error-view'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(viewId).classList.remove('hidden');
    }

    let surveyQuestions = [];

    async function load(userId = null) {
      if (!surveyId) {
        showView('error-view');
        return;
      }
      
      let url = `${API}/v1/surveys/${surveyId}`;
      if (userId) url += `?userId=${userId}`;
      
      try {
        const res = await fetch(url);
        
        if (res.status === 403) {
          showView('auth-view');
          if (userId) {
            alert("Access denied. That ID is not allowed to view this survey.");
            document.getElementById('viewerId').value = '';
          }
          return;
        }
        
        if (res.ok) {
          const data = await res.json();
          currentUserId = userId;
          document.getElementById('title').textContent = data.title;
          
          const descEl = document.getElementById('desc');
          if (data.description) {
            descEl.textContent = data.description;
            descEl.classList.remove('hidden');
          } else {
            descEl.classList.add('hidden');
          }

          // Fetch questions
          const defRes = await fetch(`${API}/v1/surveys/${surveyId}/definition${userId ? `?userId=${userId}` : ''}`);
          if (defRes.ok) {
            const defData = await defRes.json();
            surveyQuestions = defData.questions || [];
            if (!surveyQuestions.length) surveyQuestions = [{ id: 'q1', type: 'longtext', title: 'Your thoughts:' }];
            renderQuestions();
          }

          showView('survey-view');
        } else {
          showView('error-view');
        }
      } catch (err) {
        document.getElementById('error-title').textContent = "Connection Error";
        document.getElementById('error-desc').textContent = "Failed to connect to the server.";
        showView('error-view');
      }
    }

    function renderQuestions() {
      const form = document.getElementById('survey-form');
      
      let html = '';
      surveyQuestions.forEach((q, idx) => {
        html += `<div class="mb-8" id="q-container-${q.id}">
          <label class="block text-base font-medium text-textMain mb-4">
            <span class="text-textMuted font-mono mr-2">${idx + 1}.</span>${q.title}
          </label>`;

        if (q.type === 'text') {
          html += `<input type="text" id="ans-${q.id}" class="input-field p-4 text-base" required>`;
        } else if (q.type === 'longtext') {
          html += `<textarea id="ans-${q.id}" class="input-field resize-y min-h-[120px] p-4 text-base leading-relaxed" required></textarea>`;
        } else if (q.type === 'radio') {
          html += `<div class="space-y-3">`;
          (q.options || []).forEach((opt, oIdx) => {
            html += `
              <label class="flex items-center gap-3 cursor-pointer group">
                <input type="radio" name="ans-${q.id}" value="${opt}" class="w-5 h-5 text-primary bg-black border-border focus:ring-primary focus:ring-2" required>
                <span class="text-textMain group-hover:text-white transition-colors">${opt}</span>
              </label>`;
          });
          html += `</div>`;
        } else if (q.type === 'checkbox') {
          html += `<div class="space-y-3">`;
          (q.options || []).forEach((opt, oIdx) => {
            html += `
              <label class="flex items-center gap-3 cursor-pointer group">
                <input type="checkbox" name="ans-${q.id}" value="${opt}" class="w-5 h-5 text-primary bg-black border-border rounded focus:ring-primary focus:ring-2">
                <span class="text-textMain group-hover:text-white transition-colors">${opt}</span>
              </label>`;
          });
          html += `</div>`;
        }
        
        html += `</div>`;
      });

      html += `
        <div class="flex justify-end pt-4 border-t border-border">
          <button type="submit" id="submitBtn" class="btn-primary">
            Submit Response
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
      `;
      
      form.innerHTML = html;
    }

    function handleAuth(e) {
      e.preventDefault();
      const id = document.getElementById('viewerId').value.trim();
      if (!id) return;
      
      const btn = document.getElementById('authBtn');
      btn.disabled = true;
      btn.textContent = 'Verifying...';
      
      loadSurvey(id).finally(() => {
        btn.disabled = false;
        btn.textContent = 'Unlock Survey';
      });
    }

    async function handleSubmit(e) {
      e.preventDefault();
      
      const answers = {};
      
      // Collect answers
      for (const q of surveyQuestions) {
        if (q.type === 'text' || q.type === 'longtext') {
          answers[q.id] = document.getElementById(`ans-${q.id}`).value.trim();
        } else if (q.type === 'radio') {
          const checked = document.querySelector(`input[name="ans-${q.id}"]:checked`);
          if (checked) answers[q.id] = checked.value;
        } else if (q.type === 'checkbox') {
          const checked = document.querySelectorAll(`input[name="ans-${q.id}"]:checked`);
          answers[q.id] = Array.from(checked).map(el => el.value);
        }
      }
      
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = `<svg class="animate-spin h-5 w-5 mr-2 text-black" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Submitting...`;
      
      try {
        const payload = { answers: answers };
        if (currentUserId) payload.responderId = currentUserId;
        
        const res = await fetch(`${API}/v1/surveys/${surveyId}/responses`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        if (res.ok) {
          showView('success-view');
        } else {
          throw new Error("Failed to submit response");
        }
      } catch (err) {
        alert("Error: " + err.message);
        btn.disabled = false;
        btn.innerHTML = `Submit Response <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ml-2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`;
      }
    }

    // Initialize
    loadSurvey();
  </script>
</body>
</html>
